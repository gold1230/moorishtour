<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Packing fossils safely"><rect width="1200" height="675" fill="#f6efe3"/><rect x="30" y="30" width="1140" height="615" rx="30" fill="#ffffff" stroke="#e9d9c1" stroke-width="3"/><text x="80" y="96" font-family="Arial,sans-serif" font-size="42" font-weight="bold" fill="#102043">Packing fossils safely</text><text x="80" y="139" font-family="Arial,sans-serif" font-size="22" fill="#5b6470">A simple checklist for small, fragile specimens</text><g transform="translate(110,195)"><circle cx="26" cy="22" r="20" fill="#bc8438"/><text x="17" y="30" font-size="25" fill="white" font-family="Arial">✓</text><text x="74" y="31" font-size="27" font-family="Arial" fill="#102043">Photograph and document the exact piece</text></g><g transform="translate(110,279)"><circle cx="26" cy="22" r="20" fill="#bc8438"/><text x="17" y="30" font-size="25" fill="white" font-family="Arial">✓</text><text x="74" y="31" font-size="27" font-family="Arial" fill="#102043">Wrap fragile edges and prevent movement</text></g><g transform="translate(110,363)"><circle cx="26" cy="22" r="20" fill="#bc8438"/><text x="17" y="30" font-size="25" fill="white" font-family="Arial">✓</text><text x="74" y="31" font-size="27" font-family="Arial" fill="#102043">Use a firm container with padding</text></g><g transform="translate(110,447)"><circle cx="26" cy="22" r="20" fill="#bc8438"/><text x="17" y="30" font-size="25" fill="white" font-family="Arial">✓</text><text x="74" y="31" font-size="27" font-family="Arial" fill="#102043">Keep the invoice and required export papers</text></g><text x="80" y="609" font-family="Arial,sans-serif" font-size="19" fill="#64748b">Moorish Tour · Educational illustration · Not a photograph or specimen identification</text></svg>